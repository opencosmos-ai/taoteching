# process/retractions.yaml — claims this repository has withdrawn, so no copy survives
#
# A correction is made in one place and the claim it corrects has usually been
# copied into five. On 2026-08-20 the Ch 25 apparatus was corrected (every
# excavated witness reads 王, king; 人, human, is a transmitted reading), and
# two months later the withdrawn claim still stood as fact in eleven files,
# among them CLAUDE.md, a skill and a principle, the three things an AI session
# loads first. Nobody had a way to find the copies but reading.
#
# So a correction now has two halves: fix the place you found, and add the
# withdrawn claim here. `tools/check_retractions.py` then fails the build on
# every copy anywhere in the repository, today and later. Same idea as a
# glossary entry's `forbidden:` list, applied to facts instead of renderings.
#
# WHAT IS NOT A COPY, and is never flagged:
#   - CHANGELOG.md, which is dated history;
#   - a line that announces its own correction: "Corrected", "withdrawn",
#     "superseded", "retracted", "once said", "formerly", "(was", "~~" or ⚠;
#   - a section (a heading down to the next heading of its level or higher)
#     that carries a ⚠ banner, as DISCOVERIES.md §1 and §4 do;
#   - the paths in an entry's `allow:`, for a file that is history by design.
#
# THE SHAPE (read by a strict hand parser, like everything here — keep to it):
#
#   - id: kebab-case, unique
#     retracted: YYYY-MM-DD           # Pacific time, the date the correction was made
#     claim: >                        # what was said, in a sentence
#       ...
#     match: ["phrase", "phrase"]     # case-insensitive substrings; specific enough
#                                     # that a legitimate sentence cannot contain them
#     correction: >                   # what is true, in a sentence
#       ...
#     see: "path or path#anchor"      # where the correction is argued
#     allow: ["path/glob*.md"]        # optional
#
# A phrase that fires on a legitimate sentence is too broad: make it longer,
# never add the legitimate file to `allow:` to quiet it.

- id: ch25-oldest-witnesses-lack-the-king
  retracted: 2026-08-20
  claim: >
    At Ch 25 both Mawangdui silks read 人 (human) where our base reads 王
    (king), the older silk has no king in the passage, and so the oldest
    witnesses lack the king.
  match: ["silks read 人", "silk has no king", "no king anywhere in the passage", "king the oldest witnesses do not have", "four greats that the oldest witnesses do not have", "king the silks do not have", "oldest witnesses proved", "caught mid-drift"]
  correction: >
    Every excavated witness reads 王 at Ch 25: Guodian, both silks, Beida. 人
    is a transmitted reading (傅奕, Tang; 范應元, Song), and the verse follows it
    on internal grounds, the next line's 人法地 (humans follow earth).
  see: "notes/manuscript.md#ch-25-王亦大-人亦大-king-or-human-among-the-four-greats"

- id: ch1-line1-superseded-wording
  retracted: 2026-10-16
  claim: >
    Chapter 1's first line reads "The Tao that can be spoken…" or "The Tao
    that can be made into a way…".
  match: ["Tao that can be spoken is not the ever-present Tao", "Tao that can be made into a way is not"]
  correction: >
    "The Tao that can be made a way is not the ever-present Tao." Spoken gave
    way on 2026-10-14, and "into" was dropped on 2026-10-16.
  see: "chapters/001.md"
  allow: ["source/archive-google-doc-final-export-*.md"]

- id: atlas-updates-within-the-hour
  retracted: 2026-10-17
  claim: >
    The atlas updates itself within the hour of a merge.
  match: ["atlas updates itself within the hour"]
  correction: >
    notify-atlas.yml dispatches on merge and the atlas is rebuilt within a
    minute or two; the hourly rebuild is only the fallback.
  see: "ARCHITECTURE.md#how-the-work-reaches-readers"

- id: claude-md-current-state-section
  retracted: 2026-08-30
  claim: >
    CLAUDE.md has a "Current state" section to read at session start.
  match: ["with *Current state* below", "→ *Current state*"]
  correction: >
    It was dissolved on 2026-08-30 (6810bc9): status went to WORKLIST.md →
    Start here, rules to where they apply.
  see: "WORKLIST.md"

- id: lock-checker-is-future
  retracted: 2026-10-17
  claim: >
    glossary/terms.yaml and an entry's forbidden list feed a lock checker
    still to come.
  match: ["future lock checker", "for `tools/check_locks.py` later"]
  correction: >
    tools/check_locks.py reads terms.yaml today, and a new lock is live the
    moment build_index.py regenerates it.
  see: "ARCHITECTURE.md#how-a-decision-becomes-an-enforced-rule"

- id: data-dir-is-the-public-atlas
  retracted: 2026-10-17
  claim: >
    data/ is "the character atlas": sqlite, CSVs, explorer.html, graph JSON.
  match: ["the character atlas — sqlite"]
  correction: >
    data/ is the corpus as data. explorer.html is a gitignored local preview;
    the public atlas is chinese-atlas.opencosmos.ai, built from
    data/atlas-export.json.
  see: "ARCHITECTURE.md#how-the-work-reaches-readers"

- id: early-half-needs-second-draft
  retracted: 2026-10-19
  claim: >
    Chapters 1-41 need a second draft rather than another sweep, and ch 25
    and 28 still drop 周行 and 常.
  match: ["second draft of chapters 1–41", "Chapters 1–41 are the affected range"]
  correction: >
    Pass D closed its chapter-level rewrites on 2026-09-07; ch 25 was repaired
    on 2026-08-31 (T2-11) and ch 28 on 2026-09-01 (T1-7).
  see: "WORKLIST-CLOSED.md#the-finding"

- id: wei-graph-means-solely
  retracted: 2026-10-19
  claim: >
    唯's graph, 隹 (a short-tailed bird) beside 口 (mouth), means "solely, and
    nothing else."
  match: ["beside 口 (mouth) — **solely", "隹 (a short-tailed bird) beside 口 (mouth) — solely"]
  correction: >
    說文 gives 唯 as 諾也, "a yes," with 隹 for the sound only. "Only" is a
    sound-loan, also written 惟, 維 and bare 隹; the case for rendering it
    "only" rests on usage and the commentators, not on the graph.
  see: "glossary/wei-唯.md"

- id: ch25-formed-in-the-undifferentiated
  retracted: 2026-10-19
  claim: >
    Ch 25's 有物混成 reads "something formed in the undifferentiated."
  match: ["formed in the undifferentiated"]
  correction: >
    Since 2026-09-06 the verse reads "Something mixed and complete." 混 is
    locked to "mixed," and "undifferentiated" is on its forbidden list.
  see: "glossary/hun-混.md"
  allow: ["PLAN.md", "process/legacy-tao-source-code.md"]

- id: ch28-stanza-order-no-witness-diverges
  retracted: 2026-10-25
  claim: >
    No listed witness diverges from our base on the order of ch 28's three
    stanzas.
  match: ["so no listed witness diverges"]
  correction: >
    Mawangdui A orders them ravine, valley, pattern, against our base's
    ravine, pattern, valley, and pairs the valley's 辱 (ru - soiling) with
    白 (bai - white) rather than 榮 (rong - glory).
  see: "notes/manuscript.md"

- id: valley-receives-by-being-lowest
  retracted: 2026-10-25
  claim: >
    The valley receives everything precisely by being the lowest and emptiest
    place, and holds more than the peak.
  match: ["precisely by being lowest", "valley holds more than the"]
  correction: >
    The Shuowen defines the valley by its outlet: water comes out of it and
    runs on. In chs 32 and 66 the valleys run down to the river and the sea,
    and it is the rivers and seas that stay below and take the water in.
  see: "glossary/gu-谷.md"

- id: zhuangzi-take-on-the-worlds-grime
  retracted: 2026-10-25
  claim: >
    The Zhuangzi's chapter 天下 (tian xia) has Lao Dan say 受天下之垢, "take on
    the world's grime."
  match: ["受天下之垢"]
  correction: >
    Its main text reads 受天下之詬 (gou - reviling, shame), and notes 垢 (gou -
    grime) as another edition's reading. The Mawangdui silks write 詬's form
    訽 at ch 78 too, where the received text has 垢.
  see: "DISCOVERIES.md"

- id: ch61-both-silks-write-bang
  retracted: 2026-10-26
  claim: >
    At ch 61 both Mawangdui silks read 邦 (bang - state) where our base reads
    國 (guo - state), seven times.
  match: ["the Mawangdui silks read 邦", "國 ×7", "at each of the seven occurrences"]
  correction: >
    Silk A writes 邦 wherever the graph survives; silk B, copied under the Han
    taboo on Liu Bang's name, already writes 國. The chapter has nine 國.
  see: "notes/manuscript.md#ch-61-邦-國-the-han-name-taboo"
