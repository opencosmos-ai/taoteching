  note: Opens bundle B.

- chapter: 63
  bundles: [A]
  extent: complete
  units: [A.1]
  note: >
    Attested, and Han Feizi quotes this chapter too — so Ch 63 is one of the
    few carrying both the oldest manuscript witness and the oldest commentary.

- chapter: 64
  bundles: [A, C]
  extent: split
  units: [A.1, A.4, C.4]
  note: >
    The only chapter copied twice in the Guodian Laozi, and the halves are
    never joined. Bundle A carries the second half (為者敗之 onward) in unit 1
    and the first half (其安易持 onward) in unit 4, six chapters apart; bundle C
    carries the second half again. Strong evidence the received chapter is two
    circulating sayings joined later. See notes/manuscript.md, Ch 64.

- chapter: 66
  bundles: [A]
  extent: complete
  units: [A.1]
  note: >
    The highest-numbered chapter attested anywhere at Guodian. Everything from
    67 to 81 — fifteen of the twenty chapters still to draft — rests on the
    Mawangdui silks and later witnesses alone.
