# 河上公 (Héshàng Gōng) — his own chapter titles, glossed
#
# The titles are his: 老子道德經 河上公章句, Han commentary, from the Song woodblock
# reproduced in 四部叢刊 0532. Public domain by age. They are vendored in the
# `chapter_title:` frontmatter of sources/commentaries/heshanggong/NNN.md by
# tools/import_commentary.py, and they are the oldest chapter names the text has
# — interpretations in miniature, two characters wide.
#
# The pinyin and the English here are OURS, and are CC0 like everything else in
# this repository.
#
# ⚠ STATUS: working renderings, not settled translation. They were written to
# satisfy the gloss rule — the titles were entering the corpus as bare glyphs,
# and tools/export.py refuses to emit Chinese that nothing on the row can read.
# They follow the locks (道 the Tao · 德 integrity · 明 clear-seeing · 心 heart ·
# 民 the people · 樸/朴 uncarved wood · 無為 non-doing · 守 hold fast to ·
# 強 strong · 信 trust · 天 sky/nature), but they have NOT been through the
# chapter-review workflow and no commentary was consulted for them. Shalom's to
# accept, reject, or reshape.
#
# Fields: chapter · title (his Chinese) · pinyin · english (ours)

