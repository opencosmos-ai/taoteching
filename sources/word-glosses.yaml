# Content words — short English glosses
#
# WHY THIS FILE EXISTS. Of the book's 798 distinct characters, 463 reached the
# character atlas with no English at all: 378 the source tables' literal column
# never glossed in a form the harvester could align, and 85 it glossed so many
# ways that no English won a majority. Most are content words the glossary will
# never give a full entry — 楗 (a door bar), 兕 (a rhino), 籌 (a tally stick) —
# and a few are words the glossary still owes one (知 to know, 欲 desire, 名
# name). Each now has a short gloss, so its atlas card says something true.
#
# WHAT A GLOSS HERE IS. The senses the character carries IN THIS BOOK, read from
# every line it stands in, most frequent first, slash-separated. A reader
# sees them separated by " · " and without the chapter numbers, which stay
# here for the record (tools/export_atlas.py, card_english). Where the verse
# renders the character faithfully, the gloss uses the verse's English, so the
# card and the translation agree. Where the verse paraphrases, drops the
# character, or follows a manuscript variant, the gloss gives the sense of the
# graph our base text prints — a card describes its own character — and names
# the variant in parentheses (晚, 夸). A character found only in a compound is
# glossed with the compound beside it: 芻 → "straw (芻狗, straw dogs)".
#
# It is a reader's aid, NOT A LOCK. Nothing here is enforced against the verse.
# When a character earns a glossary entry, it leaves this file:
# tools/tests/test_hand_glosses.py fails while a listed character has an entry.
#
# THE GAP, MARKED. 朘 (zuī) is left out: ch 55's verse follows the variant 全
# (quán — whole), and any gloss would contradict that or misdescribe the graph.
#
# PRECEDENCE. A glossary entry, then sources/grammar-glosses.yaml and this file
# (they never share a character), then the apparatus. Read by
# tools/build_db.py into the character table as gloss_source = 'word'.
#
# Written 2026-10-14, every gloss checked against its chapter's own
# Translation block. The English is ours, and CC0 like everything else here.
#
# Fields: char · pinyin · gloss

