# Character components — the forms they take inside a character
#
# WHY THIS FILE EXISTS. A part changes shape with its place. 水 (shuǐ — water)
# standing alone is 水; at the left of a character it is squeezed into three
# strokes, 氵, which is how 沖 (chōng — empty, surging) writes it. 說文 names the
# part, so the atlas's card for 沖 said "built from 水", and a reader looking at
# 沖 could not find water anywhere in it (2026-11-15). This file says where each
# part goes and what it looks like there, and the export carries it to the
# atlas as `forms`.
#
# WHAT IT CLAIMS. How a part is written in a given position, as a fact about
# the script, the same in every character. It does not claim that any one
# character uses the form: 信 (xìn — trust) writes 言 whole, and the card's
# wording ("written 氵 at the left") stays true there too. The forms are the
# standard positional variants of traditional typography, not in dispute.
#
# WHAT IS LEFT OUT. A part whose side form is still recognizably itself (言, 糸,
# 金 at the left). And, for now, two forms outside Unicode's main CJK block,
# which the atlas's rare-character font does not yet carry: ⺮ (竹, bamboo, on
# top) and ⻊ (足, foot, at the left). Add them when the font subset is rebuilt
# (chinese-atlas: atlas/fonts.py).
#
# Fields: char (the part, as 說文 names it) · form · where (completes "written
# <form> …"). One row per form; a part may have several.

- char: "人"
  form: "亻"
  where: "at the left"
- char: "水"
  form: "氵"
  where: "at the left"
- char: "水"
  form: "氺"
  where: "at the bottom"
