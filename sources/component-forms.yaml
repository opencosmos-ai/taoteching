# Character components — the forms they take inside a character
#
# WHY THIS FILE EXISTS. A part changes shape with its place. 水 (shuǐ — water)
# standing alone is 水; at the left of a character it is squeezed into three
# strokes, 氵, which is how 沖 (chōng — empty, surging) writes it. 說文 names the
# part, so the atlas's card for 沖 said "built from 水", and a reader looking at
# 沖 could not find water anywhere in it (2026-11-15). This file says where each
# part goes and what it looks like there, and the export carries it to the
# atlas as `forms`.
#
# WHAT IT CLAIMS. How a part is written in the characters listed against it,
# and only there. Each row names the characters of this text that write the
# part in that form, judged by eye in a standard traditional typeface. A
# character that writes the part whole, or reshapes it past recognition, is on
# no row, and its card says nothing: 信 (xìn — trust) writes 言 whole; 益 (yì —
# to increase) lays 水 sideways on top; 春 (chūn — spring) keeps none of 艸.
# Until 2026-11-15 the rows described the part in general, and the card read
# them as a claim about its own character: 沖's said "written 氵 at the left, 氺
# at the bottom", and 沖 has no 氺. Shalom caught it.
#
# WHAT IS LEFT OUT. A part whose side form is still recognizably itself (言, 糸,
# 金 at the left).
#
# FONTS. Most forms are in Unicode's main CJK block, which every common font
# sets. ⺮ and ⻊ are in the Radicals Supplement, which only the atlas's
# rare-glyph font carries (added 2026-11-15). A form from any other block
# waits until that font is cut again (chinese-atlas: atlas/fonts.py), and
# tools/tests/test_export_atlas.py refuses it until then.
#
# Fields: char (the part, as 說文 names it) · form · where (completes "written
# <form> …") · chars (the characters of this text that write it so). One row
# per form and position; a part may have several. export_atlas.py fails on a
# listed character that is not built from the row's part.

- char: "人"
  form: "亻"
  where: "at the left"
  chars: "何使仁作似侯傷保代伐俗儉化傫什伎伏伯佳侮倍倚偏偽儼信"
- char: "水"
