# Character components — English glosses
#
# The components themselves come from 說文解字 (see sources/shuowen/entries.md and
# tools/import_shuowen.py), which states each character's parts in its own
# 从X / X聲 formulas. The **English here is ours**, and CC0 like everything else
# in this repository.
#
# WHY THIS FILE EXISTS. Component structure is the deepest layer this corpus can
# offer a reader who does not read Chinese, and it is inert without English.
# Knowing that 強 (qiáng — strong) is 从虫弘聲 tells you nothing unless you are
# also told that 虫 is an insect. With that one gloss, 說文's analysis becomes
# legible: 強 is filed under a grain weevil, and the "bow having force" reading
# belongs to the older graph 彊. That is exactly the argument glossary/qiang-強.md
# makes by hand.
#
# SCOPE, AND THE GAP. 602 distinct components and section-heads occur across the
# 711 characters 說文 covers. 125 are themselves characters of the Laozi and are
# glossed by the corpus already. Of the remaining 477, the ones below are the
# high-frequency classical radicals, whose meanings are settled and not in
# dispute. **The tail is deliberately not guessed.** Components whose reading is
# uncertain, or which are obscure graphs appearing once or twice, are left
# unglossed and counted by `tools/analyze.py --gloss-coverage`, on the same
# principle as the untranslated 說文 definitions: a marked gap beats an invented
# filling.
#
# These are the *graphic* senses — what the component depicts in a compound —
# which is not always the modern word's meaning. Where a lock exists for the
# character in its own right, the lock governs the character and this gloss
# governs only its use as a part.
#
