- chapter: 29
  id: 89
  line: "或挫或隳"
  base: "挫"
  base_pinyin: "cuò"
  base_english: "break or crush"
  readings:
    - { source: "heshanggong", text: "載", pinyin: "zài", english: "carry" }
  meaning_bearing: true
  our_call: heshanggong
  note: >
    Wang Bi's Siku text carries the collation note 〔案挫河上公注本作載〕, and
