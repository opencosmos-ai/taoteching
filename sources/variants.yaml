    - { source: "mawangdui-b", text: "使人之行仿", pinyin: "shǐ rén zhī xíng fǎng", english: "cause people's conduct to be hindered" }
  meaning_bearing: false
  our_call: base
  note: >
    Three things, none of which changes the line. Both silks read 使 (to
    cause) for 令 (to make) in all five lines, so this 令 is plain causative.
    They add 之 ('s) before the faculty in three of the five (使人之行,
    使人之口, 使人之耳), which makes 行 (conduct) a noun a person owns. And they
    write 妨 (to hinder) by its sound, with two different graphs: 方 in silk A,
    仿 in silk B. Every transcription consulted reads both as 妨, so the silks
    confirm the word without deciding between Wang Bi's "block" and Heshang
    Gong's "harm."
  logged: notes/manuscript.md

