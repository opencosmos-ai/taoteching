    - { source: "wangbi", text: "安以久動之", pinyin: "ān yǐ jiǔ dòng zhī", english: "from calm, by moving it for a long time" }
    - { source: "yongle-dadian", text: "安以動之", pinyin: "ān yǐ dòng zhī", english: "from calm, by moving it" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma carries an extra 久 (jiu - long), and his gloss leans on
