    - { source: "fuyi", text: "罪莫大於可欲", pinyin: "zuì mò dà yú kě yù", english: "no crime is greater than having something to desire" }
    - { source: "heshanggong", text: "罪莫大於可欲", pinyin: "zuì mò dà yú kě yù", english: "no crime is greater than having something to desire", annotation: "Heshang Gong's own text carries the clause, and glosses it as loving lewd beauty (hào yín sè yě); the Siku Wang Bi's collation note says the same." }
