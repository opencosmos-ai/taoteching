- chapter: 64
  id: 50
  line: "whole chapter"
  base: "one continuous chapter"
  base_english: "one continuous chapter"
  readings:
    - { source: "guodian", text: "halves separated; second half copied twice", english: "halves separated; second half copied twice" }
