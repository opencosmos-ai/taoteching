- chapter: 78
  id: 120
  line: "受國之垢，是謂社稷主"
  base: "垢"
  base_pinyin: "gòu"
  base_english: "grime"
  readings:
    - { source: "mawangdui-a", text: "訽", pinyin: "gòu", english: "shame or reviling", via: "shidian-guji", locator: "Chapter 78 (received numbering), the first of the two sayings on taking on the state's burdens", verification: "pending-print", confirm: "T2-74" }
