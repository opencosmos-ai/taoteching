- chapter: 28
  id: 110
  line: "知其榮，守其辱，為天下谷"
  base: "榮"
  base_pinyin: "róng"
  base_english: "honor"
  readings:
    - { source: "mawangdui-a", text: "白", pinyin: "bái", english: "white", via: "shidian-guji", locator: "Chapter 28 (received numbering), the opening epithet of the stanza on being the world's valley", verification: "pending-print", confirm: "T2-74" }
    - { source: "mawangdui-b", text: "白", pinyin: "bái", english: "white", via: "six-dsy", locator: "Chapter 28 (received numbering), the opening epithet of the stanza on being the world's valley", url: "https://6dsy.cn/daodejing-boshuyiben-28zhang/", verification: "pending-print", confirm: "T2-74" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Silk A reads 知其白，守其辱，為天下浴 (zhi qi bai, shou qi ru, wei tian xia yu -
    "know the white, hold to the soiled, serve as the world's valley") and sets
    this stanza second, between the ravine (谿 xi) and the pattern (式 shi),
    whose own line reads 守其黑 (shou qi hei - "hold to the black") with the
    character before it lost. Our base pairs ru (辱 - soiling, disgrace) with
    榮 (rong - glory), a judgment of standing; the silk pairs it with 白
    (bai - white), a mark on a surface, as ch 41's 大白若辱 (da bai ruo ru -
    "the whitest white seems soiled") does. Silk B agrees with silk A on both
    the pair and the order. The Zhuangzi (its chapter 天下, tian xia - "the
    world") quotes Lao Dan with the same two stanzas in the same order and
    with 白: 知其雄，守其雌，為天下谿。知其白，守其辱，為天下谷, then has him say
    受天下之詬 (shou tian xia zhi gou - "take on the world's reviling"; one
    edition reads 垢, grime; corrected 2026-10-25, this once quoted the
    variant as the text). Not a schema witness id, so it is recorded here. The Huainanzi (139 BCE, its
    chapter 道應 dao ying) already reads 知其榮，守其辱，為天下穀, with glory, and
    spells the valley 穀 (gu - grain), so the received reading is early too.
    Followed 2026-10-25, Shalom's call: the verse reads "Know the white, hold
    to the soiled," keeping our stanza order.
  logged: notes/manuscript.md

