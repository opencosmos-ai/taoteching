- chapter: 61
  id: 42
  line: "牝常以靜勝牡，以靜為下"
  base: "以靜為下"
  base_pinyin: "yǐ jìng wéi xià"
  base_english: "by stillness she is underneath"
  readings:
    - { source: "mawangdui-a", text: "為其靜…宜為下", pinyin: "wèi qí jìng … yí wéi xià", english: "because she is still … it is fitting that she be underneath", annotation: "Two graphs are lost; the graph for stillness is written with a variant form.", via: "wikisource", locator: "Silk A, Chapter 61 (received numbering), the lines on stillness and being underneath", url: "https://zh.wikisource.org/zh-hant/%E8%80%81%E5%AD%90_%28%E5%B8%9B%E6%9B%B8%E7%94%B2%E6%9C%AC%29#61_-_%E7%AB%A0%E5%85%AD%E5%8D%81%E4%B8%80", verification: "pending-print", confirm: "T2-74" }
    - { source: "mawangdui-b", text: "為其靜也，故宜為下也", pinyin: "wèi qí jìng yě, gù yí wéi xià yě", english: "because she is still, therefore it is fitting that she be underneath", via: "wikisource", locator: "Silk B, Chapter 61 (received numbering), the lines on stillness and being underneath", url: "https://zh.wikisource.org/zh-hant/%E8%80%81%E5%AD%90_%28%E5%B8%9B%E6%9B%B8%E4%B9%99%E6%9C%AC%29#61_-_%E7%AB%A0%E5%85%AD%E5%8D%81%E4%B8%80", verification: "pending-print", confirm: "T2-74" }
  meaning_bearing: true
  our_call: base
  note: >
    The silks give a reason where the base gives a means: "because she is
    still, therefore it is fitting that she be underneath," against "by
    stillness she is underneath." We keep the base against both excavated
    witnesses, Shalom's call 2026-10-26: every English for the silks' 宜 (yi -
    fitting) said of the female reads as a verdict on where she belongs, which
    could be used to justify her domination. Wang Bi reads the base causally
    (以其靜故能為下也), so the silks' sense survives in English "by."
  logged: notes/manuscript.md

