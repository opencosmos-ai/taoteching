# variants.yaml — the variant apparatus, as facts
#
# One entry per meaning-bearing divergence between our base text (the Wang Bi
# received recension) and the older witnesses. Read by:
#
#   python3 tools/concordance.py --witnesses 21
#   python3 tools/check_locks.py --rule unlogged-variant
#
# WHY FACTS AND NOT TRANSCRIPTIONS. The Mawangdui silks were excavated in 1973
# and the Guodian slips in 1993. Every transcription of them is modern, and
# reconstructing the damaged graphs is genuine editorial work by living
# scholars. "Mawangdui A and B read 自今及古 where Wang Bi reads 自古及今" is a
# fact about a text, and facts are not copyrightable. See PROVENANCE.md.
#
# Witness ids: wangbi (our base) · mawangdui-a (甲本, c. 200 BCE) ·
# mawangdui-b (乙本, c. 175 BCE) · guodian (~300 BCE) · beida (early Han) ·
# fuyi (Tang) · fanyingyuan (范應元, Song) · heshanggong ·
# hanfeizi (解老 / 喻老, oldest commentary)
#
# EXCAVATED vs TRANSMITTED. guodian, mawangdui-a/b and beida came out of the
# ground; fuyi, fanyingyuan, heshanggong and wangbi came down by copying. A
# transmitted edition may still preserve an old reading — but "the oldest
# witness" means the excavated ones, and an entry that follows a transmitted
# reading against all of them must say so in its note. See ch 25.
#
# Fields:
#   chapter          int
#   line             the base-text line the fork sits in
#   base             our reading (the contested characters only)
#   witnesses        {witness-id: reading}
#   meaning_bearing  true when the fork changes what the line says
#   our_call         base | <witness-id> | punctuation | undecided
#   note             one sentence on what turns on it
#   logged           where the reasoning lives, or false

- chapter: 4
  line: "湛兮，似或存"
  base: "或"
  witnesses: { heshanggong: "若" }
  meaning_bearing: false
  our_call: base
  note: >
    Heshang Gong's lemma reads 似若存, and the Siku edition of Wang Bi carries
    the collation note 〔案或一作若〕, "for 或, one edition reads 若." Both are
    hedges of the same force — 或 perhaps, 若 as if — so nothing turns on it,
    and the doubled hedge 似 + 或/若 stands either way. Logged because the line
    was rewritten in 2026-08-31 and the fork should not be rediscovered later
    as if it were news.
  logged: notes/manuscript.md

- chapter: 8
  line: "政善治"
  base: "政"
  witnesses: { heshanggong: "正", siku-wangbi: "正", yongle-dadian: "政" }
  meaning_bearing: false
  our_call: base
  note: >
    Heshang Gong's lemma prints 正 (zheng, straight/on the mark) where our base
    prints 政 (zheng, government), and his gloss follows the graph he prints —
    无有不洗，清且平也, "there is nothing it does not wash; clean and level,"
    where 平 (level) answers 正. Barely a fork: Shuowen defines the one by the
    other, 政，正也。从攴从正，正亦聲 — 政 is 正 with 攴 (a hand holding a
    stick) added. We keep 政, rendered "governing," which also leaves 治 free
    for "order" instead of colliding with it. (Updated 2026-09-24: Wang Bi is now
    vendored for this chapter, and the Siku text prints 正 too, with the note
    案永樂大典正作政古通用 — "the Yongle Dadian reads 政; anciently interchangeable."
    Both commentaries print 正; our base agrees with the Yongle.)
  logged: notes/manuscript.md

- chapter: 23
  line: "故從事於道者，同於道"
  base: "同於道"
  witnesses: { wangbi: "道者同於道" }
  meaning_bearing: false
  our_call: base
  note: >
    The vendored Wang Bi lemma prints 故從事於道者，道者同於道, with a 道者
    ("the Tao-one") our base text lacks. With it the stanza is a clean
    three-term parallel, 道者同於道；德者同於德；失者同於失; without it the
    first line has a different shape from the two that follow. The sense of
    the line is the same either way, so not meaning-bearing. We keep the base
    text and let the English mirror its asymmetry rather than silently
    repairing it.
  logged: notes/manuscript.md

- chapter: 23
  line: "同於失者，失亦樂得之"
  base: "得"
  witnesses: { heshanggong: "失" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma and gloss both read 失亦樂失之, "loss too gladly loses
    them," against our 失亦樂得之, "loss too gladly gets them." Our base closes
    the three-term pattern (the Tao gets you, integrity gets you, loss gets
    you); his breaks it in the third term, so that what loss gives you is more
    losing. We keep the base text on the parallel, which is the harder thing to
    break than to keep.
  logged: notes/manuscript.md

- chapter: 23
  line: "故飄風不終朝"
  base: "故"
  witnesses: { heshanggong: "—" }
  meaning_bearing: false
  our_call: base
  note: >
    Heshang Gong's lemma opens 飄風不終朝 with no 故 (gu, therefore), and the
    Siku Wang Bi carries the collation note 〔案河上公注本及各本俱無故字〕,
    "the Heshang Gong commentary edition and all editions lack the character
    故" — so our base is a singleton reading here by its own editors' account.
    We print the base text and leave 故 unrendered in the English (Shalom's
    call, 2026-09-04): the three statements stand in juxtaposition, as every
    other witness has them. Not an emendation; the source table still prints
    故. Shuowen makes it unambiguously causal, 使爲之也, so it could not be
    softened to a comparison instead.
  logged: notes/manuscript.md

- chapter: 52
  line: "是謂襲常"
  base: "襲"
  witnesses: { wangbi: "習", heshanggong: "習" }
  meaning_bearing: true
  our_call: base
  note: >
    Two different characters, not two readings of one. 襲 (xi) is to layer a
    garment over another; 習 (xi) is to practise. Both commentaries print 習
    here — Heshang Gong glosses it 習修常道, "practising and cultivating the
    constant Tao" — and the Siku edition of Wang Bi carries the collation note
    〔案習各本作襲〕, "for 習, all editions read 襲." We follow the base text and
    read 襲, because 是謂襲明 at ch 27 is structurally identical and 明 / 常 are
    the book's own bonded pair (知常曰明, ch 16 and 55); reading 習 here
    dissolves that pair into a coincidence. Our English at ch 52 had been
    following 習 without anyone recording the fork.
  logged: notes/manuscript.md

- chapter: 3
  line: "使夫智者不敢為也"
  base: "智者"
  witnesses: { heshanggong: "知者" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's text writes 知 and appends a phonetic note, 知音智 — "知 is
    read zhi (as 智)" — attached only here, not to the 無知 two lines above, so
    the tradition reads two words in consecutive lines even where one graph is
    written. The fork is meaning-bearing because the commentators then describe
    different people: Wang Bi glosses 智者謂知為也, "those who know how to
    handle," the operators the line restrains; Heshang Gong glosses 思慮深，不輕言,
    "deep in deliberation, not speaking lightly," which is almost word for word
    what he says of the approving 知者 at ch 56 (知者貴行不貴言也). We print the
    base text's 智者 and keep the English open — "the knowers" — because a word
    specific enough to settle the fork picks a side the Chinese does not.
  logged: notes/manuscript.md

- chapter: 3
  line: "不見可欲，使民心不亂"
  base: "民"
  witnesses: { heshanggong: "使心不亂" }
  meaning_bearing: false
  our_call: base
  note: >
    Heshang Gong's lemma has no 民 in the third clause, and our own vendored
    Wang Bi carries the Siku compilers' collation note 〔案原本及各本俱無民字，惟永
    樂大典有之…今校〕 — the base edition and every edition they consulted lack 民
    here; only the Yongle Dadian has it, and they restored it on the evidence of
    Wang Bi's commentary. Nothing in the sense turns on it: the subject is the
    people either way. Logged because our own note at ch 3 says "all three
    clauses are 使民X," and in the third clause that is an eighteenth-century
    editorial restoration rather than a reading the witnesses agree on.
  logged: notes/manuscript.md

- chapter: 38
  line: "則攘臂而扔之"
  base: "扔"
  witnesses: { heshanggong: "仍" }
  meaning_bearing: false
  our_call: base
  note: >
    Our vendored Wang Bi carries the Siku compilers' collation note
    〔案扔各本俱作仍〕 — "for 扔, all editions read 仍" — and Heshang Gong's lemma
    does read 仍. Nothing turns on it: 說文 glosses 扔 as 因也, "to draw along,"
    and 仍 carries the same sense, which is why Heshang Gong's own gloss is
    攘臂相仍引, "bare their arms and pull at one another" (引, to pull). Logged
    because our English had read "forces them," which follows neither graph —
    both are about pulling, not force.
  logged: notes/manuscript.md

- chapter: 10
  line: "天門開闔，能為雌乎"
  base: "為"
  witnesses: { heshanggong: "無" }
  meaning_bearing: true
  our_call: base
  note: >
    We print 能為雌乎, "can you be the hen?" Heshang Gong's lemma reads 能無雌乎,
    "can you be without the hen?" — the opposite instruction. And our own
    vendored Wang Bi prints 無 in the lemma with the Siku compilers' collation
    note attached: 〔案注義無似作為〕, "by the sense of the commentary, 無 appears
    to be 為." Wang Bi's commentary settles it — 雌應而不倡，因而不為。言天門開闔
    能為雌乎 — so our 為 follows the Siku editors' own correction of the text they
    print. Logged because the reading had never been recorded, and because the
    English turns on it completely.
  logged: notes/manuscript.md

- chapter: 10
  line: "明白四達，能無為乎"
  base: "無為"
  witnesses: { heshanggong: "無知" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's text reads 能無知乎 here, the same three characters he prints
    two questions earlier at 愛民治國, so his chapter asks the 無知 question twice
    and never asks the 無為 question at all. He glosses this one 無有能知道滿於天下
    者, "there is none who can know the Tao that fills the world." Wang Bi prints
    無為 and glosses it 能無以為乎，則物化矣, quoting ch 37. We keep the base text.
    Logged because our English had 無為 and 無知 on each other's lines, and the
    fork sits on exactly those two lines.
  logged: notes/manuscript.md

- chapter: 21
  line: "道之為物，惟恍惟惚"
  base: "道之為物"
  witnesses: { mawangdui-a: "道之物", mawangdui-b: "道之物" }
  meaning_bearing: false
  our_call: base
  note: >
    The silks drop 為, leaving 之 as a plain possessive — "the Tao's thingness"
    rather than "the Tao's being a thing." Both point at the same sense, so the
    reading is not in doubt; only the English is. Logged because it settles that
    the topic of the line is what the Tao amounts to as an entity.
  logged: notes/manuscript.md

- chapter: 21
  line: "自古及今，其名不去"
  base: "自古及今"
  witnesses: { mawangdui-a: "自今及古", mawangdui-b: "自今及古" }
  meaning_bearing: true
  our_call: base
  note: >
    Reverses the direction of the inquiry. Mawangdui makes the chapter start
    from the present and trace backward; Wang Bi makes it arrive at the
    present. We render the arrival, which is the movement of the chapter.
  logged: notes/manuscript.md

- chapter: 21
  line: "以閱眾甫"
  base: "閱"
  witnesses: { mawangdui-a: "順", mawangdui-b: "順" }
  meaning_bearing: true
  our_call: base
  note: >
    閱 is to observe; 順 is to follow along with. The chapter closes on a
    knowledge question (吾何以知), which the epistemic verb fits.
  logged: notes/manuscript.md

- chapter: 21
  line: "以閱眾甫"
  base: "甫"
  witnesses: { mawangdui-a: "父", mawangdui-b: "父" }
  meaning_bearing: false
  our_call: base
  note: >
    No decision needed. Ch 42 already settled that 父 here means origin or
    root, not father in the personal sense, so both give "origin" in English.
  logged: notes/manuscript.md

- chapter: 21
  line: "吾何以知眾甫之狀哉"
  base: "狀"
  witnesses: { mawangdui-a: "然", mawangdui-b: "然", heshanggong: "然", siku-wangbi: "狀 〔案狀各本俱作然〕" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    RESOLVED 2026-08-11 — we follow 然. Five arguments converge, and only the
    last four are about manuscripts. 狀 (zhuàng, shape) occurs twice in the
    whole book; 然 (rán, so) occurs twelve times, and 吾何以知…然哉？以此 is a
    FIXED CLOSING FORMULA that Ch 54 and Ch 57 both use — 然 completes it and
    狀 breaks it. Then: both Mawangdui silks read 然, the Song Heshang Gong
    edition reads 然, and the Siku compilers' own note on this line reads
    〔案狀各本俱作然〕, "for 狀, all editions read 然". Rendered "How do I know
    the origin of the many is so?", which lets a reader hear the formula in all
    three chapters. The base text and Source table keep 狀; only the
    translation follows the witnesses, as at Ch 41, 42, 47 and 53.
  logged: notes/manuscript.md

- chapter: 25
  line: "故道大，天大，地大，王亦大"
  base: "王"
  witnesses: { guodian: "王", mawangdui-a: "王", mawangdui-b: "王", beida: "王", fuyi: "人" }
  meaning_bearing: true
  our_call: fuyi
  note: >
    CORRECTED 2026-08-20. This entry previously recorded "both silks read 人"
    and was wrong in the opposite direction. Every EXCAVATED witness reads 王
    (wáng — king), Guodian (~300 BCE) included. 人 (rén — human) is a
    TRANSMITTED reading: 傅奕 (Fu Yi, Tang) carries it and claims a 古本
    ancestor. We still follow 人, but on internal grounds — the next line is
    人法地 — and not on manuscript age. See notes/manuscript.md.
  logged: notes/manuscript.md

- chapter: 25
  line: "域中有四大，而王居其一焉"
  base: "王"
  witnesses: { guodian: "王", mawangdui-a: "王", mawangdui-b: "王", beida: "王", fanyingyuan: "人" }
  meaning_bearing: true
  our_call: fanyingyuan
  note: >
    CORRECTED 2026-08-20; the "silk B caught mid-drift" reading recorded here
    before was an artefact of a bad source. Guodian, both silks and the Beida
    Han slips all read 而王居一焉. The earliest extant witness for 人居其一焉 is
    范應元 (Fan Yingyuan, Song), 老子道德經古本集註. We follow it as an editorial
    call, logged as such.
  logged: notes/manuscript.md

- chapter: 25
  line: "域中有四大"
  base: "域"
  witnesses: { guodian: "國", mawangdui-a: "國", mawangdui-b: "國", beida: "國" }
  meaning_bearing: false
  our_call: base
  note: >
    域 (bounded ground: 土 + 或) and 國 (a wall around the same 或) are one root
    with two classifiers, so the fork is not meaning-bearing. Worth keeping in
    view all the same: every excavated witness reads the STATE word, so the
    territorial frame is the oldest layer in this passage — older than the
    throne debate sitting beside it.
  logged: notes/manuscript.md

- chapter: 25
  line: "有物混成"
  base: "混"
  witnesses: { mawangdui-a: "昆", mawangdui-b: "昆" }
  meaning_bearing: false
  our_call: base
  note: "Graphic variant only; both read as merged, undifferentiated."
  logged: notes/manuscript.md

- chapter: 2
  line: "長短相形，高下相盈"
  base: "相形 … 相盈"
  witnesses: { siku-wangbi: "相較 … 相傾" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku Quanshu printing of Wang Bi reads 長短相較，髙下相傾. Our base text
    reads 形 and 盈, which are the Mawangdui readings — so our "Wang Bi base
    text" already carries non-Wang-Bi readings at this line. Worth knowing about
    the base text generally, not just here.
  logged: notes/manuscript.md

- chapter: 9
  line: "揣而銳之，不可長保"
  base: "銳"
  witnesses: { siku-wangbi: "梲" }
  meaning_bearing: true
  our_call: base
  note: >
    梲 is a roof-beam or a mallet-head; 銳 is a sharpened point. "Hammer it to a
    point" against "hammer it into a beam." We keep 銳, which the whole line's
    sense of over-sharpening requires.
  logged: notes/manuscript.md

- chapter: 9
  line: "功遂身退，天之道"
  base: "功遂"
  witnesses: { siku-wangbi: "功成名遂", heshanggong: "功成名遂" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku editors' own collation note on 王弼 reads 案河上公注本及各本俱作功成名遂身退
    — "Heshang Gong's commentary text and all editions read 功成名遂身退." Our base
    carries the shorter 功遂身退, which is therefore the minority reading among the
    editions the compilers knew. 名 (míng — name, reputation) is the character at
    stake: the longer reading adds "the name achieved" beside "the work
    completed," which is what 河上公 then glosses at ch 44 (名遂則身退也). We keep
    the base, per the standing rule that this is an edition of the received
    recension; the fork is recorded because the English turns on how many things
    are finished before the body withdraws.
  logged: notes/manuscript.md

- chapter: 20
  line: "俗人昭昭，我獨昏昏"
  base: "昏昏"
  witnesses: { heshanggong: "若昏" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku editors attach the note 案昏昏河上公注本作若昏 to 王弼's text, and our
    vendored 河上公 prints 我獨若昏. Our base doubles the character — a
    reduplicated state, matching 昭昭, 察察, 悶悶 and 沌沌 elsewhere in the
    chapter — where his reads 若 (ruò — as if), hedging it into a simile. The
    chapter is built on reduplication, so the doubled form is the one that fits
    its own pattern, and we keep the base. 河上公 then glosses his own shorter
    reading 如闇昧也, which restores by commentary the force his text softened.
  logged: notes/manuscript.md

- chapter: 26
  line: "君子終日行不離輜重"
  base: "君子"
  witnesses: { siku-wangbi: "聖人", heshanggong: "聖人" }
  meaning_bearing: true
  our_call: base
  note: >
    Our base reads 君子 (the gentleman — a Confucian term); BOTH the Siku Wang Bi
    and the Song Heshang Gong read 聖人 (the sage), and the Siku reads 王 where we
    read 主 later in the chapter (萬乘之主). Two independent editions against our
    reading. Directly relevant to the thread on reading past the throne, since it
    shows the two vocabularies competing inside one recension. See DISCOVERIES.md
    §1. (Corrected 2026-09-24: this note had 主 and 王 the wrong way round.)
  logged: notes/manuscript.md

- chapter: 26
  line: "輕則失本，躁則失君"
  base: "失本"
  witnesses: { heshanggong: "失臣", yongle-dadian: "失根" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku note on Wang Bi reads 案本河上公注本作臣永樂大典作根 — Heshang Gong's
    text reads 臣 (minister), the Yongle Dadian reads 根 (root). Our 本 closes the
    chapter back onto its first line, 重為輕根; 河上公's 臣 makes lightness cost a
    ruler their ministers instead. The Yongle 根 is our claim in line 1's own word.
  logged: notes/manuscript.md

- chapter: 55
  line: "未知牝牡之合而朘作"
  base: "朘"
  witnesses: { siku-wangbi: "全", mawangdui-a: "朘", fuyi: "朘" }
  meaning_bearing: true
  our_call: base
  note: >
    Correcting our own record. The manuscript note long claimed our base text
    read 全 and that we were keeping it; our source table in fact reads 朘, the
    Mawangdui and Fu Yi reading, while the verse renders 全 ("their whole being
    quickens"). The received Wang Bi reading is 全, as the Siku printing shows.
    So the verse follows 全 and the source table shows 朘. Found by the
    commentary import, 2026-08-11.
  logged: notes/manuscript.md

- chapter: 32
  line: "道常無名。樸雖小"
  base: "道常無名。樸雖小"
  witnesses: {}
  meaning_bearing: true
  our_call: punctuation
  note: >
    A punctuation fork, not a textual one, and the Chinese carries no
    punctuation at all. Received breaks after 無名, making 樸 the subject that
    is small. We read 無名樸 as one attribute of the Tao, making the Tao what
    is small.
  logged: notes/manuscript.md

- chapter: 41
  line: "大器晚成"
  base: "晚成"
  witnesses: { mawangdui-a: "免成", guodian: "曼成" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Completed late, against never completed. We follow the witnesses because it
    completes the parallel with 無隅 / 希聲 / 無形, each "the great X lacks its
    defining mark."
  logged: notes/manuscript.md

- chapter: 42
  line: "吾將以為教父"
  base: "教父"
  witnesses: { mawangdui-a: "學父" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    Father of teaching, against father of learning. We follow the silk — the
    bolder reading and the older one. 父 means origin or root here.
  logged: notes/manuscript.md

- chapter: 46
  line: "禍莫大於不知足"
  base: "(two calamity clauses)"
  witnesses: { mawangdui-a: "罪莫大於可欲 (a third, prior clause)", fuyi: "罪莫大於可欲" }
  meaning_bearing: true
  our_call: base
  note: >
    The older witnesses remember a rising three-beat — crime/desire,
    disaster/discontent, fault/greed — that the received text trimmed to two.
    We keep the received pair and note the fuller crescendo.
  logged: notes/manuscript.md

- chapter: 47
  line: "不見而名"
  base: "名"
  witnesses: { mawangdui-a: "明" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    The homophone pair, both míng. We follow 明 (clear-seeing): it completes the
    parallel of know / see-clearly / accomplish, each without its usual means.
  logged: notes/manuscript.md

- chapter: 51
  line: "長之育之，亭之毒之"
  base: "亭之毒之"
  witnesses: { heshanggong: "成之熟之" }
  meaning_bearing: true
  our_call: base
  note: >
    亭/毒 are obscure here and have long puzzled readers; Heshang Gong's edition
    reads 成之熟之 ("completes them, ripens them"), which is plainer and may be
    an early clarification of a hard reading rather than a witness to a different
    original. Logged for the Ch 51 sweep.
  logged: notes/manuscript.md

- chapter: 53
  line: "是謂盜夸"
  base: "夸"
  witnesses: { mawangdui-a: "竽", mawangdui-b: "竽", hanfeizi: "竽" }
  meaning_bearing: true
  our_call: mawangdui-a
  note: >
    夸 is swagger; 竽 is the great reed mouth-organ that led the ancient
    ensemble. 盜竽 makes the gleaming ruler not merely a loud thief but the
    ringleader whose tune the rest play along to. Han Feizi reads it so.
  logged: notes/manuscript.md

- chapter: 55
  line: "未知牝牡之合而全作"
  base: "全"
  witnesses: { mawangdui-a: "朘", fuyi: "朘" }
  meaning_bearing: true
  our_call: base
  note: >
    朘 is specifically the infant boy's member. We keep our base text's 全
    (whole) in its plain sense, which preserves the point about desireless
    potency while keeping the emblem available to infants of every gender.
  logged: notes/manuscript.md

- chapter: 61
  line: "大國者下流 … (國 ×7)"
  base: "國"
  witnesses: { mawangdui-a: "邦", mawangdui-b: "邦" }
  meaning_bearing: false
  our_call: base
  note: >
    The systematic Han name-taboo avoiding the personal name of the founding
    emperor Liu Bang (劉邦). Meaning-neutral, logged once rather than at each
    of the seven occurrences.
  logged: notes/manuscript.md

- chapter: 61
  line: "小國以下大國，則取大國"
  base: "則取大國"
  witnesses: { }
  meaning_bearing: true
  our_call: base
  note: >
    Not a witness fork but an editorial one: some editions supply 於 (取於大國)
    to license a passive reading. We keep the active in both halves, since the
    chiastic repetition is the argument. Heshang Gong reads it actively too.
  logged: notes/manuscript.md

- chapter: 63
  line: "大小多少，報怨以德"
  base: "報怨以德"
  witnesses: { mawangdui-a: "報怨以德" }
  meaning_bearing: false
  our_call: base
  note: >
    Not a fork but an attestation, and it settles a long-standing suspicion.
    The line is routinely treated as a stray from Ch 79 (和大怨) that migrated
    here. Mawangdui A has it in this chapter, immediately after 大小多少, so it
    is original to Ch 63 and the collision with Analects 14.34 is the text's
    own.
  logged: notes/manuscript.md

- chapter: 63
  line: "夫輕諾必寡信"
  base: "輕諾必寡信"
  witnesses: { mawangdui-b: "damaged — two graphs illegible in the 輕…信 span" }
  meaning_bearing: false
  our_call: base
  note: >
    Both silks are damaged through this line and B preserves only part of it,
    so the 信 → trust lock rests here on the received text alone. Recorded as
    the fact of the damage, not as anyone's reconstruction of the lost graphs.
  logged: notes/manuscript.md

- chapter: 62
  line: "美言可以市尊，美行可以加人"
  base: "市尊，美行"
  witnesses: { mawangdui-a: "市 | 尊行", mawangdui-b: "市 | 尊行", wangbi: "市 | 尊行 (in the commentary, not the transmitted text)", heshanggong: "市 | 尊行", fuyi: "于市 | 尊言", huainanzi: "市尊 | 美行 (quoted twice)" }
  meaning_bearing: true
  our_call: base
  note: >
    RESOLVED 2026-08-12 by Shalom, against the recommendation, and the
    recommendation is recorded because the evidence is genuinely split. The
    silks, Fu Yi, Fan Yingyuan and both commentaries divide after 市 and read
    尊行; our base divides after 尊 and reads 美行, and the Huainanzi (c. 139
    BCE) quotes the base reading twice, in 人間訓 and 道應訓, with Yu Yue and
    Zhu Qianzhi following it. We keep the base: the 美 / 美 parallel is the
    reading our own recension carries and the oldest quotation supports, and
    the split camp is not unanimous either (Fu Yi reads 尊言, not 尊行). The
    arguments on the other side — lectio difficilior, and Wang Bi's commentary
    disagreeing with the text printed over it — are set out in
    notes/manuscript.md and stand as the case against this call.
  logged: notes/manuscript.md

- chapter: 62
  line: "道者萬物之奧"
  base: "奧"
  witnesses: { mawangdui-a: "注", mawangdui-b: "注" }
  meaning_bearing: true
  our_call: base
  note: >
    The chapter's opening word, and the oldest witnesses do not have it. Gao
    Ming's Boshu Laozi Jiaozhu reads the silks' 注 as a loan for 主 (zhu —
    master), giving "the Tao is the master of the countless things", and cites
    Zheng Xuan on Liji Liyun (奧猶主也) and Zuozhuan Zhao 13 (國有奧主) to show
    that 奧 itself bore that sense. We keep 奧 and decline the mastery reading,
    because Ch 34 denies it twice in the identical words — 衣養萬物而不為主 and
    萬物歸焉而不為主. Both of the silks' available senses (注 as "pour into",
    or 主 by way of 奧's own "one who presides at the corner") run through a
    place, and the place is the older layer of the word. See notes/translation.md.
  logged: notes/manuscript.md

- chapter: 62
  line: "故立天子，置三公"
  base: "三公"
  witnesses: { mawangdui-a: "三鄉 (read by editors as 三卿)", mawangdui-b: "三鄉 (read by editors as 三卿)" }
  meaning_bearing: false
  our_call: base
  note: >
    The silks write 鄉, which editors read as a loan for 卿 (qing — high
    minister). Not meaning-bearing, and logged because it settles an English
    question: 公 is conventionally rendered "duke", but the oldest witness names
    the office with the word that means minister. Our "the three ministers"
    is the older reading's own word. The same line confirms 天子 stands in the
    silks — the title is not a later accretion.
  logged: notes/manuscript.md

- chapter: 62
  line: "善人之寶，不善人之所保"
  base: "寶 … 保"
  witnesses: { mawangdui-a: "one graph used in both positions", mawangdui-b: "one graph used in both positions", dunhuang: "所不保" }
  meaning_bearing: true
  our_call: base
  note: >
    Two separate forks. (1) Where our base uses two different graphs, 寶
    (treasure) then 保 (keep safe), the silks use the same graph twice —
    published transcriptions differ on which, and that disagreement is itself
    modern editorial work. So the received text's pair may be a later
    differentiation of one word. (2) Dunhuang manuscripts, Yan Zun and Zhao
    Zhijian read 不善人之所不保 — with a negation, reversing the clause. Yan
    Kejun reports all editions reading 所保. We keep the base text; the
    negation would make the Tao what the unmasterful fail to keep, which
    contradicts the chapter's 何棄之有.
  logged: notes/manuscript.md


- chapter: 64
  line: "其脆易泮，其微易散"
  base: "泮"
  witnesses: { heshanggong: "破" }
  meaning_bearing: true
  our_call: base
  note: >
    Our Wang Bi base reads 泮 (pàn — to thaw; the water radical, ice going
    soft), Heshang Gong's lemma text reads 破 (pò — to shatter). Thaw versus
    break, for a thing described as 脆 (cuì — brittle). The Siku editors flag
    the head character too — 〔案脆釋文云一作膬〕, the Shiwen reporting 膬 for
    脆. We keep the base graph and render toward shattering, which is what
    brittleness does; the fork is small but it is the difference between a
    thing dissolving and a thing snapping.
  logged: notes/manuscript.md

- chapter: 64
  line: "whole chapter"
  base: "one continuous chapter"
  witnesses: { guodian: "halves separated; second half copied twice" }
  meaning_bearing: false
  our_call: base
  note: >
    At Guodian the two halves of this chapter are not adjacent and not
    equally attested. Bundle A carries the second half (為者敗之 onward) in its
    first slip-unit and the first half (其安易持 onward) in its fourth, with
    other chapters between them; bundle C carries the second half again. So the
    second half is the only passage in the Guodian Laozi copied twice, and the
    two halves never appear joined in the order our base text gives them. A
    fact about how the material circulated around 300 BCE, not a fork to
    decide — but strong evidence the received chapter is two sayings joined,
    and the seam is visible in the sense at exactly the point the slips break
    it. See sources/guodian-inventory.yaml.
  logged: notes/manuscript.md

- chapter: 65
  line: "知此兩者亦稽式"
  base: "稽"
  witnesses: { heshanggong: "楷" }
  meaning_bearing: false
  our_call: base
  note: >
    Our Wang Bi base reads 稽式 (jī shì); Heshang Gong's text reads 楷式 (kǎi
    shì), and the Siku editors flag it themselves — 〔案河上公注本稽作楷下同〕,
    "in the Heshang Gong recension 稽 is written 楷, and likewise below." Both
    compounds mean a standard or model, so the English is the same either way.
    Recorded because the two commentators gloss it differently and the reading
    turns on that, not on the graph: Wang Bi takes 稽 as 同 (tóng — held in
    common), 今古之所同則不可廢, "what past and present hold in common cannot be
    discarded"; Heshang Gong takes 楷式 as 法式, the working pattern for
    governing self and state.
  logged: notes/manuscript.md

- chapter: 67
  line: "天下皆謂我道大，似不肖"
  base: "我道大"
  witnesses: { heshanggong: "我大" }
  meaning_bearing: true
  our_call: heshanggong
  note: >
    RESOLVED 2026-08-19 — we follow 我大, "I am vast," against our own base text.
    Six arguments converge. (1) 不肖 is a self-deprecating FIRST-PERSON term in
    classical Chinese — "I, the unworthy one," from a child not resembling its
    father; it is a person-word. (2) Heshang Gong's lemma omits 道 and his
    comment is unmistakably personal: 我則佯愚似不肖, "I then feign foolishness
    and seem unworthy." (3) He reads 細 as 小人, a petty person, not a small
    thing — which is where the earlier argument for the base text collapsed.
    (4) The chapter continues 我有三寶 with no change of subject. (5) 我 is the
    self SEEN (glossary/wo-wu-我吾.md), which is exactly what 天下皆謂我 needs.
    (6) Ch 20 and Ch 70 are the same chapter in other words, both first-person,
    both about being misperceived by 天下, and Ch 20 shares the 我…似X shape
    verbatim. 道 looks like a copyist softening an apparent boast. The base text
    and Source table keep 道; only the verse follows the witness, as at Ch 21.
  logged: notes/manuscript.md

- chapter: 67
  line: "不敢為天下先，故能成器長"
  base: "器"
  witnesses: { hanfeizi: "事" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku compilers flag it themselves — 〔案器韓非子作事〕, "for 器, the Han
    Feizi text reads 事." So the oldest witness to this passage reads 成事長,
    chief of affairs, where our base reads 成器長, chief of vessels. The
    difference is real: 器 (vessel, and the counter-term to 樸, uncarved wood)
    makes the line say that the uncarved comes to lead the carved; 事 (affairs)
    makes it an ordinary claim about precedence in undertakings. We keep 器,
    which Ch 28's 樸散則為器 supports, and log the older reading rather than
    bury it.
  logged: notes/manuscript.md

- chapter: 73
  line: "天之所惡，孰知其故？"
  base: "line absent"
  witnesses: { wangbi: "是以聖人猶難之", heshanggong: "是以聖人猶難之" }
  meaning_bearing: true
  our_call: wangbi
  note: >
    RESOLVED 2026-08-20 — the line is RESTORED to the Source table and to
    source/chinese.md, by Shalom's call. Our base text had OMITTED a line that both classical commentaries carry after
    孰知其故 — 是以聖人猶難之, "therefore even the sage finds it difficult." It
    is not a variant reading but a missing line, and both commentators build
    their argument on it: Wang Bi writes 夫聖人之明猶難於勇敢，況無聖人之明而欲行之也
    ("the sage's own clarity still finds daring difficult; how much more one
    who lacks it and means to act anyway"), and Heshang Gong glosses it almost
    identically. Modern editors delete it as an importation from Ch 63, where
    the same six characters stand followed by 故終無難矣. But the deletion is
    editorial and modern, and the two oldest commentaries on our own base
    recension both had the line in front of them. UNDECIDED: restoring it means
    adding a row to the Source table, which is a base-text change and Shalom's
    call. The verse is currently drafted without it.
  logged: notes/manuscript.md

- chapter: 68
  line: "善勝敵者，不與"
  base: "敵"
  witnesses: { heshanggong: "戰" }
  meaning_bearing: false
  our_call: base
  note: >
    Our base reads 善勝敵者, "one masterful at overcoming enemies"; Heshang
    Gong's lemma reads 善勝戰者, "one masterful at winning battles." His own
    comment then uses 敵 twice — 不與敵爭而敵自服也 — so the reading behind the
    commentary is our base's, and the lemma looks like a copyist's assimilation
    to 善戰者 in the line above. Not meaning-bearing; logged because the
    chapter's four parallel 善X者 clauses are its whole structure, and a witness
    that repeats 戰 in two of them flattens it.
  logged: notes/manuscript.md

- chapter: 69
  line: "故抗兵相若，哀者勝矣"
  base: "相若"
  witnesses: { wangbi: "相加", heshanggong: "相加" }
  meaning_bearing: false
  our_call: base
  note: >
    Our base text reads 相若 (xiāng ruò — "are alike"), but the Siku printing of
    Wang Bi and the Song Heshang Gong both lemmatise 相加 (xiāng jiā), and Wang Bi
    glosses it 加當也 — "加 means to be a match for." Both readings land on
    "evenly matched," so nothing in the English turns on it. Logged because this
    is the third place our so-called Wang Bi base departs from the Siku Wang Bi
    (see Ch 2 and Ch 73), which is a fact about the base text rather than about
    this chapter.
  logged: notes/manuscript.md

- chapter: 72
  line: "無狎其所居"
  base: "狎"
  witnesses: { heshanggong: "狹" }
  meaning_bearing: true
  our_call: base
  note: >
    Two homophones, xiá. 狎 is 犭 (dog) beside 甲 — to crowd in, to grow
    over-familiar, to make light of. 狹 is 犭 beside 夾 (squeezed between) —
    narrow, cramped. The base reading is an act done to the people from
    outside; 河上公's is a condition of the space itself, which is what his
    reading of the chapter needs (心居神…當寬柔，不當急狹 — "the heart is where
    the spirit dwells; it should be broad and yielding, not tight and cramped").
    王弼 has 狎 in his own commentary (自貴則物狎厭居生), so the base is secure.
  logged: notes/manuscript.md

- chapter: 74
  line: "夫代司殺者殺，是謂代大匠斫"
  base: "代司殺者殺"
  witnesses: { heshanggong: "代司殺者" }
  meaning_bearing: false
  our_call: base
  note: >
    Our base doubles 殺 — "to stand in for the one who presides over killing
    and kill." 河上公's lemma has it once: 夫代司殺者是謂代大匠斵. The Siku
    editors flag the divergence inside 王弼's own commentary text
    〔案河上公注本作夫代司殺者是謂代大匠斲〕, so both printings in this
    repository agree that the two recensions differ here. Nothing in the
    English turns on it: an office named "the one whose work is the killing"
    already contains the act. Logged because it is a fourth place our base
    departs from a Siku-flagged reading (see Ch 2, 68, 73).
  logged: notes/manuscript.md

- chapter: 75
  line: "民之輕死，以其上求生之厚，是以輕死"
  base: "以其上求生之厚"
  witnesses: { wangbi: "以其求生之厚", heshanggong: "以其求生之厚" }
  meaning_bearing: true
  our_call: base
  note: >
    Our base has 上 (shàng — those above) in the third charge; the lemmas in
    both commentary printings vendored here lack it, which throws 其 back onto
    the people and reverses who is being accused. 河上公's gloss reads it as the
    people; 王弼's comment — 皆由上不由其下也, "entirely due to those above, not
    those below" — reads the sense our base spells out. We keep the base for the
    triple parallel and for 王弼's 皆. Logged in notes/manuscript.md.
  logged: notes/manuscript.md

- chapter: 76
  line: "是以兵強則不勝，木強則折"
  base: "木強則折"
  witnesses: { wangbi: "木強則兵", heshanggong: "木強則共" }
  meaning_bearing: true
  our_call: base
  note: >
    A three-way split, and both commentary printings vendored here depart from
    our base. 折 (zhé — to snap) is the base. 王弼's lemma reads 兵 (bīng —
    weapons), and his gloss commits to it: 物所加也, "it is what gets applied to
    it" — the strong tree draws the axe, so strength attracts violence rather
    than causing failure. 河上公's lemma reads 共 (gòng — together), glossed
    木強大枝弱共生其上也, "the tree being big and strong, the weak branches grow
    together above it" — which turns the line into a setup for the closing
    couplet about below and above. We keep 折: the chapter's argument is
    physical throughout (corpse, green stem, dry stick), and 兵 would repeat the
    character from the clause immediately before it.
  logged: notes/manuscript.md

- chapter: 80
  line: "使有什伯之器而不用"
  base: "什伯之器"
  witnesses: { heshanggong: "什伯人之器" }
  meaning_bearing: false
  our_call: base
  note: >
    The Siku editors flag it inside 王弼's own text — 〔案什伯下河上公注本及各本
    俱有人字〕, "below 什伯, 河上公's commentary edition and all editions have the
    character 人" — and 河上公's lemma confirms it, splitting at exactly that seam
    (使有什伯 / 人之器而不用). With 人 the phrase is "tools for tens and hundreds of
    people"; without it, "ten- and hundred-fold tools." Both land on labour that
    many hands would otherwise do, which is what 王弼 reads anyway (無所用，何患
    不足 — "nowhere to use them; why worry about not enough?"). Logged because it
    is a fifth place our base departs from a Siku-flagged reading (see Ch 2, 68,
    73, 74), and because 河上公 takes his 人 in a different direction from
    王弼: 器謂農人之器 — the tools are the *farmers'*, and 不用 means the state
    does not requisition them (不徵召奪人良時也).
  logged: notes/manuscript.md

# --- Ch 19 · the Guodian fork, recorded 2026-08-28 (EDITING-PASS Pass B / PLAN G1) ---
# The best-known meaning-bearing divergence in the whole Guodian Laozi. Recorded as
# facts about which characters are present, not as a transcription: the Guodian
# 釋文 is 1998 living scholarship. See PROVENANCE.md.

- chapter: 19
  line: "絕聖棄智，民利百倍"
  base: "絕聖棄智"
  witnesses: { guodian: "絕智棄辯" }
  meaning_bearing: true
  our_call: base
  note: >
    聖 (shèng — sagehood) is not among the terms the oldest witness severs here;
    the slips pair 智 (zhì — knowing) with 辯 (biàn — disputation) instead.
  logged: notes/manuscript.md

- chapter: 19
  line: "絕仁棄義，民復孝慈"
  base: "絕仁棄義"
  witnesses: { guodian: "絕偽棄慮" }
  meaning_bearing: true
  our_call: base
  note: >
    The received attack on 仁義 (rén yì — humaneness and duty) is absent from
    Guodian, which severs 偽 (wěi — artifice) and 慮 (lǜ — anxious scheming).
    Neither 仁 nor 義 appears in the passage at all. The reconstruction of the
    second graph is contested among editors; the fact that 仁義 is absent is not.
  logged: notes/manuscript.md

- chapter: 19
  line: "絕巧棄利，盜賊無有"
  base: "絕巧棄利"
  witnesses: { guodian: "絕巧棄利" }
  meaning_bearing: false
  our_call: base
  note: >
    The one couplet of the three that Guodian and the received text share. Its
    agreement is what makes the other two forks legible as substitutions rather
    than as a different passage.
  logged: notes/manuscript.md

- chapter: 16
  line: "致虛極"
  base: "致"
  witnesses: { heshanggong: "至" }
  meaning_bearing: true
  our_call: base
  note: >
    Our base (Wang Bi) reads 致 (zhi - to send/carry all the way there; Shuowen
    送詣也, from 夊 a dragging foot and 至 to arrive). Heshang Gong's lemma reads
    至 (zhi - to arrive at), and his gloss repeats it: 至於虛極, "arrives at the
    far end of empty." The fork is about agency. 致 has someone carrying the
    emptying to its far point; 至 has them simply arriving there. We keep the
    base text, and render with no object supplied - "Go totally empty" - which
    is true to both readings rather than picking one by inserting a word neither
    witness has. Every candidate object is imported: Heshang Gong supplies 五內
    (wu nei - the five viscera), ch 3 supplies 其心 (qi xin - their heart), and
    ch 16 has neither.
  logged: notes/manuscript.md

- chapter: 16
  line: "吾以觀復"
  base: "觀復"
  witnesses: { heshanggong: "觀其復" }
  meaning_bearing: false
  our_call: base
  note: >
    Heshang Gong's lemma reads 吾以觀其復, with 其 (qi - their). The Siku
    editors' collation note in our own Wang Bi text says the same and goes
    further: 〔案觀下河上公注本及各本俱有其字〕, "below 觀, Heshang Gong's
    commentary edition and all editions have the character 其." So our base is
    alone in lacking it, the same situation as ch 23's 故 in reverse. The sense
    is unchanged either way, so not meaning-bearing. Worth recording because the
    English had been silently supplying it - "I observe their return" renders a
    character our base does not print.
  logged: notes/manuscript.md

- chapter: 51
  line: "夫莫之命而常自然"
  base: "命"
  witnesses: { wangbi_collation: "爵" }
  meaning_bearing: true
  our_call: base
  note: >
    Our vendored Wang Bi carries the line 命並作爵 - "命 is written 爵 (jue - to
    confer a noble rank) [in other editions]" - under the Siku editors' own note
    flagging it as probably a collation gloss mistaken for Wang Bi's comment:
    〔案此句疑係命字下原校注語誤作弼注〕. With 爵 the line reads "no one ennobles
    it" rather than "no one commands it." Meaning-bearing: 爵 is a granting of
    rank, 命 an issuing of orders, and the difference decides whether the Tao's
    honour is withheld by nobody or ordered by nobody. We keep the base. Logged
    because the variant is evidence for 命's conferral sense - see
    glossary/ming-命.md - and because the editions it names are not identified,
    so no witness id is claimed for it.
  logged: notes/manuscript.md

- chapter: 35
  line: "往而不害，安平太"
  base: "安平太"
  witnesses: { heshanggong: "安太平", yongle-dadian: "安平泰" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku editors flag this spot inside our own Wang Bi text:
    〔案平太河上公注本作太平永樂大典作平泰〕 - "as for 平太, Heshang Gong's
    annotated edition reads 太平; the Yongle Dadian reads 平泰." Wang Bi himself
    glosses only 不害 and passes over these three characters in silence.
    Meaning-bearing because the shuffling decides the parse. 太平 (tai ping) is
    the Han political-religious term - the Taiping Jing, the Yellow Turbans'
    Way of Great Peace - and Heshang Gong reads it that way outright:
    則國安家寧而致太平矣, "then the state is at rest and the household at peace,
    and it arrives at Great Peace." 泰 (tai - smooth, at ease) is a third
    near-synonym in the same slot. We keep the base and decline the Han term.
    The instability itself is the evidence: 太 heads a compound at ch 17 (太上)
    and ch 20 (太牢) and never stands alone in this book, so 安平太 is 安平 plus
    an intensifier, not a list of three. Rendered "at rest, and utterly even."
  logged: notes/manuscript.md

- chapter: 35
  line: "用之不可既"
  base: "不可既"
  witnesses: { siku-wangbi: "不足既" }
  meaning_bearing: true
  our_call: base
  note: >
    Our vendored Wang Bi lemma reads 用之不足既, with the Siku editors noting
    〔案足河上公注本及各本俱作可〕 - "as for 足, Heshang Gong's annotated edition
    and all editions write 可." So our base agrees with everyone except the
    Siku Wang Bi. Meaning-bearing for the shape of the whole passage: with 足
    the three closing lines run 不足見 / 不足聞 / 不足既 unbroken, and with 可 the
    third line breaks the frame - the first two say there is not enough of it,
    the third says it cannot be done. Wang Bi's own commentary uses 不可
    (乃用之不可窮極也, "thus using it cannot be exhausted to its limit"), which
    argues the 足 in his lemma is transmission rather than his reading. We keep
    the base, and the English keeps the break: "There is not enough to see /
    There is not enough to hear / It never runs out."
  logged: notes/manuscript.md

- chapter: 11
  line: "埏埴以為器"
  base: "埏"
  witnesses: { shiwen: "挻" }
  meaning_bearing: false
  our_call: base
  note: >
    The Siku editors note inside our Wang Bi text: 〔案埏各本俱作埏惟釋文作挻〕 -
    "all editions write 埏; only the Shiwen (Lu Deming's Jingdian Shiwen, c. 583)
    writes 挻." Not meaning-bearing, since every reading gives "work the clay."
    Recorded because the Shuowen sides with the minority: 埏 is glossed
    八方之地也, "the land of the eight directions" - the far reaches of the earth,
    not kneading at all - while 挻 (shan) is the graph that carries the working
    sense. Heshang Gong takes the sense on the majority graph anyway: 埏，和也,
    "埏 means to blend." We keep the base and render "knead."
  logged: notes/manuscript.md

- chapter: 36
  line: "國之利器不可以示人"
  base: "國"
  witnesses: { hanfeizi: "邦" }
  meaning_bearing: false
  our_call: base
  note: >
    Han Feizi (d. 233 BCE), the oldest witness there is, reads 邦之利器. 邦 (bang
    - a state) is the older word; 國 (guo) displaced it under the Han taboo on
    the personal name of 劉邦 (Liu Bang, d. 195 BCE), the dynasty's founder. So
    our base almost certainly carries a Han substitution, and Han Feizi predates
    the taboo by a lifetime. Not meaning-bearing - both are the state - and no
    English turns on it. Recorded because it dates our base text: wherever 邦
    would be expected and 國 stands, the line has passed through Han hands.
  logged: notes/manuscript.md

- chapter: 36
  line: "將欲廢之，必固興之"
  base: "將欲廢之，必固興之"
  witnesses: { hanfeizi: "absent" }
  meaning_bearing: true
  our_call: base
  note: >
    Han Feizi quotes three of the four clauses and not this one: 翕/張, 弱/強,
    and 取/與, with no 廢/興 (fei / xing - to bring down / to raise up). He also
    reads 翕 for 歙 and 取 (qu - to take) for 奪 (duo - to seize). Meaning-bearing
    because a fourth clause changes the shape of the stanza, and because 奪 is
    a snatching - 說文 手持隹失之也, "a hand holding a bird and losing it" - where
    取 is a plain taking. We keep all four and the base graphs. Han Feizi is
    quoting to illustrate two historical episodes, not reproducing a text, so
    his silence is weak evidence for absence. Recorded because he is the oldest
    witness and because the three he does quote he quotes exactly.
  logged: notes/manuscript.md

- chapter: 36
  line: "柔弱勝剛強"
  base: "柔弱勝剛強"
  witnesses: { yongle-dadian: "柔勝剛，弱勝強", hanfeizi: "弱勝強" }
  meaning_bearing: true
  our_call: base
  note: >
    Our Wang Bi carries the Siku note 〔案永樂大典作柔勝剛弱勝强〕 - "the Yongle
    Dadian reads 柔勝剛，弱勝強." That splits one four-term claim, "the soft-weak
    overcomes the hard-strong," into two paired ones: "the soft overcomes the
    hard, the weak overcomes the strong." Han Feizi supports the split by
    quoting only half of it - 謂「弱勝強」也 - as a two-term saying. Meaning-bearing:
    the base binds 柔 to 弱 and 剛 to 強 as compounds, the variant keeps four
    separate terms in two matched pairs. We keep the base; the English renders
    it as two pairs anyway, which is the honest reading of a compound whose
    halves the book uses separately everywhere else.
  logged: notes/manuscript.md

- chapter: 39
  line: "故致數譽無譽"
  base: "譽"
  witnesses: { siku-wangbi: "輿", shiwen: "輿", heshanggong: "車" }
  meaning_bearing: true
  our_call: siku-wangbi
  note: >
    We depart from the base. Our vendored Wang Bi prints 故致數輿無輿 and the
    Siku editors say why: 〔案兩輿字河上公注本作車釋文作輿原本誤作譽今據釋文校改〕 -
    "the two 輿 characters: Heshang Gong's edition writes 車; the Shiwen writes
    輿; the original mistakenly wrote 譽, now emended per the Shiwen." Our base
    carries the character they call the error. Both commentaries explain a
    vehicle and neither explains praise: Wang Bi 故致數輿乃無輿也, "counting the
    carriage through, there is then no carriage"; Heshang Gong 人就車數之，為輻、
    為輪、為轂、為衡、為轝，無有名為車者, "a person goes up to a cart and counts it -
    spokes, wheel, hub, yoke, body - and there is nothing among them named
    'cart'." A commentator's gloss is evidence for what stood in his text.
    The graphs are near-twins: 譽 is 言 over 與, 輿 is 車 within 舁. Heshang Gong
    also reads a cart two lines earlier (see the 不穀 entry), so his whole close
    is a cart. Rendered "count the parts of a cart, and there is no cart",
    which lands ch 11's image - 轂 is 說文 輻所凑也, "what the spokes converge on".
  logged: notes/manuscript.md

- chapter: 39
  line: "其致之"
  base: "其致之"
  witnesses: { various: "其致之一也", kaiyuan: "其致之" }
  meaning_bearing: false
  our_call: base
  note: >
    The Siku editors note 〔案各本致之下有一也二字焦竑云開元本無〕 - "all editions
    have the two characters 一也 after 致之; 焦竑 (Jiao Hong, 1540-1620) says the
    Kaiyuan edition (713-741) lacks them." With 一也 the line reads "what brings
    this about is the one", which matches Wang Bi's gloss 各以其一致此清寧靈盈生貞.
    Not meaning-bearing: the one is the subject either way. Recorded because it
    is the only place in this chapter where our base agrees with the Tang
    edition against everyone else, and because 焦竑 is named, which is rare.
  logged: notes/manuscript.md

- chapter: 39
  line: "侯王無以貴高，將恐蹶"
  base: "貴高"
  witnesses: { various: "貞貴高" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku editors note 〔案各本以下有貞字〕 - "all editions have the character 貞
    below 以." Meaning-bearing, and it decides the shape of the whole chapter.
    With 貞 the sixth pair mirrors its positive half exactly (為天下貞 / 無以貞)
    and the series runs unbroken six for six. Without it, our base breaks the
    mirror at the sixth pair - and 貴高 (gui gao - prized and high) is what the
    next two lines pick up: 故貴以賤為本，高以下為基. We keep the base, because
    the break is the hinge: the series stops mirroring at exactly the point
    where the chapter turns from cosmology to rank. See WORKLIST T3-6.
  logged: notes/manuscript.md

- chapter: 39
  line: "侯王得一以為天下貞"
  base: "貞"
  witnesses: { heshanggong: "正" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma reads 侯王得一以天下爲正 and he glosses it 為天下平正,
    "be the world's level-and-upright." 貞 (zhen) is 說文 卜問也。从卜，貝以爲贄 -
    "to inquire by cracking a shell; from 卜, the crack, with the cowry as the
    offering" - divination, hence what is consulted, hence steadfast and
    correct. 正 (zheng) is plain uprightness. Meaning-bearing: 貞 is the thing
    consulted to know what is right, 正 is being right. We keep the base and
    render "true for the world", in the carpenter's sense. Note that 正 is
    inside the deferred 正/奇 question (T4-2) and this entry does not touch it.
  logged: notes/manuscript.md

- chapter: 39
  line: "是以侯王自謂孤、寡、不穀"
  base: "不穀"
  witnesses: { heshanggong: "不轂" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma reads 不轂 (bu gu - "not a hub") where our base has
    不穀 (bu gu - "not good grain"), and he glosses it 不轂喻不能如車轂為衆輻所湊 -
    "不轂 means being unable to be like a cart's hub, on which the many spokes
    converge." 穀 and 轂 share the phonetic 𣪊 and are easily confused.
    Meaning-bearing: our base gives a ruler's humility title, "unworthy",
    literally not-good-grain; his gives the cart image that his text also has
    two lines later at 故致數車無車. So in Heshang Gong the chapter closes on a
    cart twice, which is independent support for the 輿/車 reading above. We
    keep the base, where the three titles - 孤 (orphaned), 寡 (alone), 不穀 -
    are all self-deprecations of rank, which is what the passage argues.
  logged: notes/manuscript.md

- chapter: 13
  line: "寵為下"
  base: "寵"
  witnesses: { heshanggong: "辱" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma reads 辱為下 and glosses it 辱為下賤, "disgrace is low and
    cheap." Our base reads 寵為下, "favor is the lower position." Meaning-bearing,
    and it reverses which half of the pair the line is about. With 寵 the point
    is counter-intuitive and is the chapter's argument: being favoured marks you
    as the inferior party, since favour comes down from someone above, so it
    shakes you exactly as disgrace does. With 辱 the line is the ordinary
    observation that disgrace is degrading, which explains nothing the chapter
    has not already said. Wang Bi supports the base by treating favour and
    disgrace as one condition - 寵必有辱，榮必有患。驚辱等，榮患同也, "favour
    necessarily carries disgrace, glory necessarily carries trouble; being
    startled and being disgraced are equivalent, glory and trouble are the
    same." We keep the base. Guodian attests this chapter (bundle B, unit B.1)
    but no Guodian reading of this line is recorded here - see PROVENANCE.
  logged: notes/manuscript.md

- chapter: 13
  line: "若可寄天下 / 若可託天下"
  base: "若可"
  witnesses: { yongle-dadian: "則可以 / 乃可以", heshanggong: "則可…於天下 / 乃可以…於天下" }
  meaning_bearing: false
  our_call: base
  note: >
    Two Siku notes: 〔案若可寄永樂大典作則可以寄河上公注本作則可寄於天下〕 and
    〔案若可託永樂大典作乃可以託河上公注本作乃可以託於天下〕. All the variants are
    consequential particles - 則可以 and 乃可以 both mean "then may" - so none of
    them changes the sense. Recorded because our source table glosses 若 here as
    "seems" ("Seems they can be entrusted"), which would soften the claim, and
    every other witness plus both commentators read a plain consequence: Wang Bi
    如此乃可以託天下也, Heshang Gong 則可寄於天下. The English takes the
    consequence and drops the particle.
  logged: notes/manuscript.md

- chapter: 15
  line: "孰能安以動之徐生"
  base: "安以動之"
  witnesses: { heshanggong: "安以久動之", siku-wangbi: "安以久動之", yongle-dadian: "安以動之" }
  meaning_bearing: true
  our_call: base
  note: >
    Heshang Gong's lemma carries an extra 久 (jiu - long), and his gloss leans on
    it: 誰能安靜以久徐徐以長生也, "who can be settled and still for long, and slowly
    slowly attain long life." The 久 pulls the line toward 長生, the longevity
    reading. Without it the line is an exact mirror of 孰能濁以靜之徐清 above it -
    state, action applied to it, slow result - and that parallel is the pair's
    whole point. We keep the base. (Updated 2026-09-24: the Siku Wang Bi carries
    久 as well, with the note 案永樂大典無久字 — "the Yongle Dadian has no 久." So
    both commentaries have it and our base agrees with the Yongle alone.)
  logged: notes/manuscript.md

- chapter: 15
  line: "儼兮其若客"
  base: "客"
  witnesses: { siku-wangbi: "容", heshanggong: "客" }
  meaning_bearing: true
  our_call: base
  note: >
    The Siku Wang Bi prints 儼兮其若容 with the note 案容一本作客 — "for 容, one
    edition reads 客." 容 (rong - countenance, bearing) against 客 (ke - guest).
    With 客 the line is a simile about a person (dignified, like a guest); with
    容 it is about a demeanour, and 容 already stands in the chapter at 強為之容.
    Wang Bi's own gloss on the series, 凡此諸若皆言其容象不可得而形名也, speaks
    of 容象 without settling which graph he read. Recorded when the ten missing
    Wang Bi chapters were recovered; the base is kept provisionally — WORKLIST R3.
  logged: notes/manuscript.md

- chapter: 78
  line: "受國之不祥，是謂天下王"
  base: "是謂"
  witnesses: { siku-wangbi: "是為" }
  meaning_bearing: false
  our_call: base
  note: >
    The Siku Wang Bi prints 是為天下王 (this IS the ruler of the world) against our
    是謂 (this is CALLED), in the second half of a pair whose first half both
    print as 是謂社稷主. Our reading keeps the pair parallel.
  logged: false

- chapter: 29
  line: "或挫或隳"
  base: "挫"
  witnesses: { heshanggong: "載" }
  meaning_bearing: true
  our_call: heshanggong
  note: >
    Wang Bi's Siku text carries the collation note 〔案挫河上公注本作載〕, and
    Heshang Gong's lemma reads 或載或隳. 挫 is Shuowen 摧也, to break, beside
    隳, to ruin - two wrecking words, where the three pairs before it are all
    oppositions (行/隨, 歔/吹, 强/羸). 載 is 乘也 on the cart radical 車, to
    carry: carried up against toppled down restores the pair, and Wang Bi's own
    gloss requires one - 凡此諸或，言物事逆順反覆. Both witnesses are
    TRANSMITTED, not excavated; Guodian does not carry this chapter. Followed on
    internal grounds, not on manuscript age.
  logged: notes/manuscript.md

- chapter: 29
  line: "或歔或吹"
  base: "歔"
  witnesses: { heshanggong: "呴" }
  meaning_bearing: true
  our_call: base
  note: >
    Wang Bi's Siku text notes 〔案歔河上公注本作呴〕. Heshang Gong glosses his own
    reading as a temperature pair - 呴溫也，吹寒也。有所溫必有所寒也, "呴 is to
    warm, 吹 is to cool; what warms one thing must cool another." Our base reads
    歔, Shuowen 欷也…一曰出气也, to sob or to let out breath, which gives a
    soft-breath against a hard-blow rather than warm against cold. We keep the
    base and record the other reading.
  logged: notes/manuscript.md


# ---------------------------------------------------------------------------
# 韓非子 harvest, 2026-09-10 (WORKLIST R1). The importer had marked 35 divergent
# lemmas across 14 chapters since the library was vendored and nobody had read
# them. Sorted: 4 meaning-bearing, 3 worth recording, 3 already logged above,
# and 25 orthographic or particle — see the collective note at ch 0 below.
# ---------------------------------------------------------------------------

- chapter: 38
  line: "故失道而後德，失德而後仁"
  base: "失道而後德"
  witnesses: { hanfeizi: "失道而後失德" }
  meaning_bearing: true
  our_call: undecided
  note: >
    The oldest witness prints 失 twice per clause where our base prints it
    once, five clauses running. Our base is a DESCENT — lose the Tao, and then
    there is 德; lose 德, and then there is 仁 — each rung appearing as the one
    above it goes. 韓非's is a CASCADE: lose the Tao and then lose 德, lose 德
    and then lose 仁. Nothing appears; everything is successively forfeited.
    The chapter was rebuilt in Pass D around 失 as its spine (WORKLIST T1-4),
    and our English reads "So when the Tao is lost, then integrity." Which
    text we follow decides whether 仁 and 義 are what is left after a loss or
    two more things lost. Undecided pending Shalom.
  logged: notes/manuscript.md

- chapter: 64
  line: "以輔萬物之自然，而不敢為"
  base: "輔"
  witnesses: { hanfeizi: "恃" }
  meaning_bearing: true
  our_call: base
  note: >
    輔 (fǔ — to assist, a cart's side-brace) against 恃 (shì — to lean your
    weight on). Our base has the sage SUPPORTING 自然; 韓非 has the sage
    RELYING on it. The second is the humbler claim and arguably the more
    Laozian, since it removes the sage's agency entirely. 恃 is a locked term
    here (glossary/shi-恃.md — "the heart putting its weight on something"),
    and the book's own 為而不恃 (2, 10, 51, 77) makes 恃 something the sage
    does NOT do — which is the strongest argument for keeping 輔, since 韓非's
    reading would have the sage 恃 approvingly on the one line in the book
    where that is praised. We keep the base and record the older reading.
  logged: notes/manuscript.md

- chapter: 58
  line: "廉而不劌"
  base: "劌"
  witnesses: { hanfeizi: "穢" }
  meaning_bearing: true
  our_call: base
  note: >
    劌 (guì — to cut, to wound; on 刀, the knife radical) against 穢 (huì —
    filthy, weed-choked; on 禾, grain). The line sits in a four-beat series
    about edges and light — 方而不割 · 廉而不劌 · 直而不肆 · 光而不耀 — where
    every other member pairs a property with the harm it declines to do.
    劌 completes that pattern and 穢 breaks it, which is why we keep the base.
    The two are close in sound and the 韓非 reading is most likely a graphic
    or phonetic slip; it is recorded rather than assumed away.
  logged: notes/manuscript.md

- chapter: 60
  line: "非其神不傷人，聖人亦不傷人"
  base: "人"
  witnesses: { hanfeizi: "民" }
  meaning_bearing: true
  our_call: undecided
  note: >
    The oldest witness reads 聖人亦不傷民 where our base reads 傷人 — and the
    first half of the couplet has 人 in both. So 韓非's text distinguishes the
    two clauses: the numinous does not harm PEOPLE, the sage does not harm THE
    GOVERNED. Our base flattens them to one word. This is a textual instance of
    the 民/人 question Shalom has deferred (WORKLIST T4), so it is recorded and
    not settled — but it is evidence that the distinction was live in the
    oldest witness rather than an artifact of later copying.
  logged: notes/manuscript.md

- chapter: 50
  line: "虎無所用其爪"
  base: "用"
  witnesses: { hanfeizi: "錯" }
  meaning_bearing: false
  our_call: base
  note: >
    錯 here is 措 (cuò — to place, to set down), not "error": the tiger has
    nowhere to PUT its claws, against our base's nowhere to USE them. The
    triple 投其角 · 用其爪 · 容其刃 mixes verbs in both recensions, so neither
    reading is forced by the parallel. Kept as base; 用 is also a covered lock
    (wu-you-無有.md).
  logged: false

- chapter: 1
  line: "道可道，非常道"
  base: "道可道"
  witnesses: { hanfeizi: "道之可道" }
  meaning_bearing: false
  our_call: base
  note: >
    韓非 inserts 之, making the subject explicitly nominal — "as for the Tao,
    that it can be spoken." Our base's bare 道可道 leaves the first 道 doing
    double duty as topic and verb-object, which is the compression the chapter
    is famous for. The sense is the same; the reading is recorded because
    ch 1's opening is the most-translated line in the book and the fuller
    grammar is worth knowing about.
  logged: false

- chapter: 54
  line: "善建者不拔，善抱者不脫，子孫以祭祀不輟"
  base: "善建者 … 子孫以祭祀不輟"
  witnesses: { hanfeizi: "善建不拔 … 子孫以其祭祀世世不輟" }
  meaning_bearing: false
  our_call: base
  note: >
    韓非 drops 者 from both 善X者 openings and expands the close with 其 and
    世世 (generation after generation). Neither changes the claim. Recorded
    because 善X者 is a frame this edition tracks across chapters (WORKLIST
    T2-47), so a witness without the 者 is worth knowing when that frame is
    settled.
  logged: false
