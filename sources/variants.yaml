    范應元 (Fan Yingyuan, Song), 老子道德經古本集註. We follow it as an editorial
    call, logged as such.
  logged: notes/manuscript.md

- chapter: 25
  id: 20
  line: "域中有四大"
  base: "域"
  base_pinyin: "yù"
  base_english: "domain"
  readings:
    - { source: "guodian", text: "國", pinyin: "guó", english: "state" }
    - { source: "mawangdui-a", text: "國", pinyin: "guó", english: "state" }
    - { source: "mawangdui-b", text: "國", pinyin: "guó", english: "state" }
    - { source: "beida", text: "國", pinyin: "guó", english: "state" }
  meaning_bearing: false
  our_call: base
  note: >
    域 (bounded ground: 土 + 或) and 國 (a wall around the same 或) are one root
    with two classifiers, so the fork is not meaning-bearing. Worth keeping in
    view all the same: every excavated witness reads the STATE word, so the
    territorial frame is the oldest layer in this passage — older than the
    throne debate sitting beside it.
  logged: notes/manuscript.md

- chapter: 25
  id: 21
  line: "有物混成"
  base: "混"
  base_pinyin: "hùn"
  base_english: "mixed together"
  readings:
    - { source: "mawangdui-a", text: "昆", pinyin: "kūn", english: "together, in this reading" }
