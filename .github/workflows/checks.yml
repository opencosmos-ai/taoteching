name: checks

# Turns the standing rules into a gate: a chapter cannot regress to "virtue" or
# "heaven" without this going red. The pre-commit hook checks only what you are
# committing; this checks the whole book, every push.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step, deliberately: every tool here is stdlib
      # only, so a fresh clone can run the checks with nothing else present.

      - name: the checker's own tests
        run: python3 -m unittest discover -s tools/tests -v

      - name: verse line breaks
        run: python3 tools/fix-linebreaks.py --check

      - name: generated glossary files are current
        run: |
          python3 tools/build_index.py
          git diff --exit-code glossary/ || {
            echo "::error::glossary/INDEX.md or terms.yaml is stale."
            echo "::error::run python3 tools/build_index.py and commit the result."
            exit 1
          }

      # A principle whose evidence link has rotted is worse than one with no
      # link at all: it looks checked. notes/translation.md requires that its
      # headings carry only the stable claim precisely so these resolve, and
      # this is what makes that requirement load-bearing rather than advisory.
      - name: principles — anchors resolve, the threshold holds, and every entry is shaped to run
        run: python3 tools/build_principles.py --check

      - name: generated principles files are current
        run: |
          python3 tools/build_principles.py
          git diff --exit-code process/principles/INDEX.md process/principles.yaml || {
            echo "::error::process/principles/INDEX.md or principles.yaml is stale."
            echo "::error::run python3 tools/build_principles.py and commit the result."
            exit 1
          }

      # data/constellation-chars.json sat in the repo for weeks carrying glosses
      # that data/characters.csv had already withdrawn: two generated files
      # publishing different things, because nothing rebuilt the second one.
      # Found by a person, on 2026-08-31. The atlas is deterministic — two
      # builds of the same manuscript are byte-identical — so it can be gated
      # the same way the glossary is.
      - name: generated atlas files are current
        run: |
          python3 tools/build_db.py
          python3 tools/export.py
          python3 tools/build_graph.py
          git diff --exit-code data/ || {
            echo "::error::data/ is stale — a generated file disagrees with its source."
            echo "::error::run: python3 tools/build_db.py && python3 tools/export.py"
            echo "::error::     && python3 tools/build_graph.py   then commit data/."
            exit 1
          }

      # WORKLIST.md keeps lists that restate its own table. Four went stale in
      # three days and a person found every one by reading.
      - name: the worklist against itself
        run: python3 tools/check_worklist.py

      # Errors only, so a failure shows just what has to change. Warnings and
      # info get their own step below, where they cannot be mistaken for it.
      - name: the locks
        run: python3 tools/check_locks.py --severity error

      # Warnings never fail the build — repeated-formula findings are a reading
      # for Shalom, not a verdict — but they belong in the log where they can be
      # seen without anyone remembering to look.
      - name: warnings and notes
        if: always()
        run: python3 tools/check_locks.py --severity info || true
