name: notify-opencosmos

# opencosmos.ai reads this repo in two places, and both are built from
# data/atlas-export.json (opencosmos ADR 0020):
#
#   the Library — a page per chapter, built into the site at deploy time.
#     Signalled by a Vercel deploy hook, VERCEL_DEPLOY_HOOK: the same hook URL
#     opencosmos-ai/knowledge already holds under that name.
#
#   Cosmo's copy — knowledge/sources/taoism-tao-te-ching.md, generated from
#     the export. Signalled by a repository_dispatch to opencosmos-ai/knowledge,
#     which regenerates the file and re-embeds it. Needs KNOWLEDGE_DISPATCH_TOKEN:
#     a fine-grained token with Contents: read and write on knowledge alone.
#
# One change to the export sends both, so the page a reader sees and the text
# Cosmo quotes move together.
#
# A missing VERCEL_DEPLOY_HOOK fails the run. It used to skip with a notice and
# pass, and the Library went on serving a week-old text while every run showed
# green (2026-10-25: ch 41's "labor" merged and never reached the site). A
# missing KNOWLEDGE_DISPATCH_TOKEN still skips with a notice, because
# knowledge's daily scheduled run picks the text up anyway.

on:
  push:
    branches: [main]
    paths: [data/atlas-export.json]
  workflow_dispatch:

jobs:
  redeploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: tell opencosmos.ai to rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set, so opencosmos.ai was not told to rebuild and the Library still serves the old text. Copy the hook URL from Vercel (opencosmos → Settings → Git → Deploy Hooks), then: gh secret set VERCEL_DEPLOY_HOOK -R opencosmos-ai/taoteching"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deploy requested"

  regenerate-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: tell knowledge to regenerate Cosmo's copy
        env:
          TOKEN: ${{ secrets.KNOWLEDGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::KNOWLEDGE_DISPATCH_TOKEN not set; knowledge's daily run will pick this up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/opencosmos-ai/knowledge/dispatches \
            -d '{"event_type":"text-updated","client_payload":{"text":"tao-te-ching","sha":"${{ github.sha }}"}}'
